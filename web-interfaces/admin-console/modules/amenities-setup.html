<!-- Empty State -->
<div id="amenityEmptyState" style="background: white; border-radius: 8px; padding: 60px; text-align: center; border: 1px solid var(--border-light);">
    <i class="fas fa-couch fa-3x" style="color: var(--border-light); margin-bottom: 15px;"></i>
    <p style="color: var(--text-muted); font-size: 16px;">Select a hostel to configure amenities</p>
    <p style="color: var(--text-muted); font-size: 12px; margin-top: 10px;">Enable or disable various amenities and facilities</p>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log('Amenities Setup module loaded');
    
    // BACKEND INTEGRATION: Load hostel amenities configuration
    // TODO: Fetch amenities data from backend API
    
    const amenityHostelSelect = document.getElementById('amenityHostelSelect');
    const amenityConfig = document.getElementById('amenityConfig');
    const amenityEmptyState = document.getElementById('amenityEmptyState');
    
    amenityHostelSelect.addEventListener('change', function() {
        if (this.value) {
            amenityConfig.style.display = 'block';
            amenityEmptyState.style.display = 'none';
            
            // BACKEND INTEGRATION: Load amenities for selected hostel
            // TODO: Fetch amenities configuration for selected hostel
            console.log('Loading amenities for:', this.value);
        } else {
            amenityConfig.style.display = 'none';
            amenityEmptyState.style.display = 'block';
        }
    });
    
    document.getElementById('saveAmenities').addEventListener('click', function() {
        this.innerHTML = '<i class="fas fa-sync fa-spin"></i> Saving...';
        setTimeout(() => {
            this.innerHTML = '<i class="fas fa-save"></i> Save Configuration';
            alert('Amenities configuration saved successfully!');
        }, 2000);
    });
    
    document.getElementById('addAmenity').addEventListener('click', function() {
        this.innerHTML = '<i class="fas fa-sync fa-spin"></i> Opening...';
        setTimeout(() => {
            this.innerHTML = '<i class="fas fa-plus"></i> Add Amenity';
            // TODO: Open custom amenity addition form
        }, 1000);
    });
});
</script>
