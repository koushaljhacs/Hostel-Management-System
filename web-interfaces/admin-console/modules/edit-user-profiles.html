<div class="dashboard-header">
    <h2><i class="fas fa-user-edit"></i> Edit User Profiles</h2>
    <div class="quick-actions">
        <button class="btn" id="saveProfile"><i class="fas fa-save"></i> Save Changes</button>
        <button class="btn" id="resetProfile"><i class="fas fa-undo"></i> Reset</button>
    </div>
</div>

<div class="card-container">
    <div class="card">
        <div class="card-header">
            <div class="card-icon">
                <i class="fas fa-users"></i>
            </div>
            <h3>Total Users</h3>
        </div>
        <h2 class="card-loading">
            <i class="fas fa-sync fa-spin"></i>
        </h2>
    </div>
    <div class="card">
        <div class="card-header">
            <div class="card-icon">
                <i class="fas fa-user-check"></i>
            </div>
            <h3>Active Today</h3>
        </div>
        <h2 class="card-loading">
            <i class="fas fa-sync fa-spin"></i>
        </h2>
    </div>
    <div class="card">
        <div class="card-header">
            <div class="card-icon">
                <i class="fas fa-clock"></i>
            </div>
            <h3>Pending Updates</h3>
        </div>
        <h2 class="card-loading">
            <i class="fas fa-sync fa-spin"></i>
        </h2>
    </div>
</div>

<div style="display: grid; grid-template-columns: 1fr 2fr; gap: 20px;">
    <!-- User List Sidebar -->
    <div style="background: white; border-radius: 8px; padding: 20px; border: 1px solid var(--border-light);">
        <h3 style="color: var(--primary-color); margin-bottom: 15px;">User List</h3>
        <div style="margin-bottom: 15px;">
            <input type="text" class="form-input" placeholder="Search users..." style="width: 100%; padding: 10px; border: 1px solid var(--border-medium); border-radius: 6px;">
        </div>
        <div style="max-height: 400px; overflow-y: auto;">
            <div style="text-align: center; padding: 40px;">
                <i class="fas fa-sync fa-spin fa-2x" style="color: var(--primary-color);"></i>
                <p style="margin-top: 15px; color: var(--text-muted);">Loading user list...</p>
            </div>
        </div>
    </div>

    <!-- Profile Editor -->
    <div style="background: white; border-radius: 8px; padding: 20px; border: 1px solid var(--border-light);">
        <h3 style="color: var(--primary-color); margin-bottom: 20px;">Profile Editor</h3>
        
        <div style="text-align: center; padding: 60px;">
            <i class="fas fa-user-edit fa-3x" style="color: var(--border-light); margin-bottom: 15px;"></i>
            <p style="color: var(--text-muted); font-size: 16px;">Select a user from the list to edit their profile</p>
            <p style="color: var(--text-muted); font-size: 12px; margin-top: 10px;">You can modify user details, permissions, and account settings</p>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log('Edit User Profiles module loaded');
    
    // BACKEND INTEGRATION: Load user list
    // TODO: Fetch user list from backend API
    // fetch('/api/users/list').then(...)
    
    document.getElementById('saveProfile')?.addEventListener('click', function() {
        this.innerHTML = '<i class="fas fa-sync fa-spin"></i> Saving...';
        setTimeout(() => {
            this.innerHTML = '<i class="fas fa-save"></i> Save Changes';
        }, 1500);
    });
});
</script>
