<div class="dashboard-header">
    <h2><i class="fas fa-plus-circle"></i> Create New Hostel</h2>
    <div class="quick-actions">
        <button class="btn" id="saveHostel" style="background: var(--success-color); color: white;">
            <i class="fas fa-save"></i> Create Hostel
        </button>
        <button class="btn" id="clearForm">
            <i class="fas fa-times"></i> Clear Form
        </button>
    </div>
</div>

<div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
    <!-- Hostel Details Form -->
    <div>
        <!-- Basic Information -->
        <div style="background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-light);">
            <h3 style="color: var(--primary-color); margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                <i class="fas fa-info-circle"></i> Basic Information
            </h3>
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Hostel Name *</label>
                <input type="text" class="form-input" placeholder="Enter hostel name" style="width: 100%; padding: 10px; border: 1px solid var(--border-medium); border-radius: 6px;">
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                <div>
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Hostel Code *</label>
                    <input type="text" class="form-input" placeholder="e.g., BH-A, GH-B" style="width: 100%; padding: 10px; border: 1px solid var(--border-medium); border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Hostel Type *</label>
                    <select class="form-input" style="width: 100%; padding: 10px; border: 1px solid var(--border-medium); border-radius: 6px;">
                        <option value="">Select Type</option>
                        <option value="boys">Boys Hostel</option>
                        <option value="girls">Girls Hostel</option>
                        <option value="co-ed">Co-educational</option>
                    </select>
                </div>
            </div>
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Address *</label>
                <textarea class="form-input" placeholder="Enter complete address" style="width: 100%; padding: 10px; border: 1px solid var(--border-medium); border-radius: 6px; min-height: 80px; resize: vertical;"></textarea>
            </div>
        </div>

        <!-- Capacity & Facilities -->
        <div style="background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-light);">
            <h3 style="color: var(--primary-color); margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                <i class="fas fa-building"></i> Capacity & Facilities
            </h3>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                <div>
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Total Floors *</label>
                    <input type="number" class="form-input" placeholder="Number of floors" style="width: 100%; padding: 10px; border: 1px solid var(--border-medium); border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Total Rooms *</label>
                    <input type="number" class="form-input" placeholder="Total rooms" style="width: 100%; padding: 10px; border: 1px solid var(--border-medium); border-radius: 6px;">
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                <div>
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Total Capacity *</label>
                    <input type="number" class="form-input" placeholder="Total students capacity" style="width: 100%; padding: 10px; border: 1px solid var(--border-medium); border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Room Types</label>
                    <select class="form-input" style="width: 100%; padding: 10px; border: 1px solid var(--border-medium); border-radius: 6px;">
                        <option value="">Select Room Types</option>
                        <option value="single">Single Occupancy</option>
                        <option value="double">Double Occupancy</option>
                        <option value="triple">Triple Occupancy</option>
                        <option value="multiple">Multiple Options</option>
                    </select>
                </div>
            </div>
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 10px; font-weight: 600;">Available Facilities</label>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;">
                    <label style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" style="accent-color: var(--primary-color);">
                        <span>Wi-Fi</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" style="accent-color: var(--primary-color);">
                        <span>Laundry</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" style="accent-color: var(--primary-color);">
                        <span>Gym</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" style="accent-color: var(--primary-color);">
                        <span>Common Room</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" style="accent-color: var(--primary-color);">
                        <span>Study Room</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" style="accent-color: var(--primary-color);">
                        <span>CCTV</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Contact Information -->
        <div style="background: white; border-radius: 8px; padding: 20px; border: 1px solid var(--border-light);">
            <h3 style="color: var(--primary-color); margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                <i class="fas fa-phone"></i> Contact Information
            </h3>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                <div>
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Warden Name *</label>
                    <input type="text" class="form-input" placeholder="Warden's full name" style="width: 100%; padding: 10px; border: 1px solid var(--border-medium); border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Warden Contact *</label>
                    <input type="tel" class="form-input" placeholder="Warden's phone number" style="width: 100%; padding: 10px; border: 1px solid var(--border-medium); border-radius: 6px;">
                </div>
            </div>
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Email Address</label>
                <input type="email" class="form-input" placeholder="hostel@college.edu" style="width: 100%; padding: 10px; border: 1px solid var(--border-medium); border-radius: 6px;">
            </div>
            
            <div>
                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Emergency Contact</label>
                <input type="tel" class="form-input" placeholder="Emergency contact number" style="width: 100%; padding: 10px; border: 1px solid var(--border-medium); border-radius: 6px;">
            </div>
        </div>
    </div>

    <!-- Summary & Actions -->
    <div>
        <!-- Summary Card -->
        <div style="background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-light);">
            <h3 style="color: var(--primary-color); margin-bottom: 15px;">Hostel Summary</h3>
            
            <div style="background: #f8f9fa; padding: 15px; border-radius: 6px; margin-bottom: 15px;">
                <div style="display: flex; justify-content: between; margin-bottom: 8px;">
                    <span style="font-weight: 600;">Status:</span>
                    <span style="color: var(--text-muted);">New Hostel</span>
                </div>
                <div style="display: flex; justify-content: between; margin-bottom: 8px;">
                    <span style="font-weight: 600;">Hostel Code:</span>
                    <span style="color: var(--text-muted);">Auto-generated</span>
                </div>
                <div style="display: flex; justify-content: between; margin-bottom: 8px;">
                    <span style="font-weight: 600;">Capacity:</span>
                    <span style="color: var(--text-muted);">0 students</span>
                </div>
                <div style="display: flex; justify-content: between;">
                    <span style="font-weight: 600;">Rooms:</span>
                    <span style="color: var(--text-muted);">0 rooms</span>
                </div>
            </div>
            
            <button class="btn" id="createHostelBtn" style="width: 100%; background: var(--success-color); color: white; padding: 12px;">
                <i class="fas fa-building"></i> Create Hostel
            </button>
        </div>

        <!-- Quick Setup -->
        <div style="background: white; border-radius: 8px; padding: 20px; border: 1px solid var(--border-light);">
            <h3 style="color: var(--primary-color); margin-bottom: 15px;">Quick Setup</h3>
            
            <div style="display: grid; gap: 10px;">
                <button class="btn" style="text-align: left; justify-content: flex-start; padding: 10px;">
                    <i class="fas fa-copy"></i> Copy from Existing
                </button>
                <button class="btn" style="text-align: left; justify-content: flex-start; padding: 10px;">
                    <i class="fas fa-layer-group"></i> Add Floors
                </button>
                <button class="btn" style="text-align: left; justify-content: flex-start; padding: 10px;">
                    <i class="fas fa-bed"></i> Setup Rooms
                </button>
                <button class="btn" style="text-align: left; justify-content: flex-start; padding: 10px;">
                    <i class="fas fa-users"></i> Assign Staff
                </button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log('Create New Hostel module loaded');
    
    // BACKEND INTEGRATION: Hostel creation form
    // TODO: Implement hostel creation API integration
    
    document.getElementById('createHostelBtn').addEventListener('click', async function() {
        const originalText = this.innerHTML;
        this.innerHTML = '<i class="fas fa-sync fa-spin"></i> Creating...';
        this.disabled = true;

        // BACKEND INTEGRATION: Collect form data and send to API
        // const hostelData = {
        //     name: document.getElementById('hostelName').value,
        //     code: document.getElementById('hostelCode').value,
        //     type: document.getElementById('hostelType').value,
        //     // ... collect all form data
        // };
        
        // TODO: Replace with actual API call
        // const response = await fetch('/api/hostels/create', {
        //     method: 'POST',
        //     headers: { 'Content-Type': 'application/json' },
        //     body: JSON.stringify(hostelData)
        // });

        // Simulate API call
        setTimeout(() => {
            this.innerHTML = '<i class="fas fa-check"></i> Created!';
            this.style.background = 'var(--success-color)';
            
            alert('Hostel created successfully! You can now add floors and rooms.');
            
            setTimeout(() => {
                document.getElementById('clearForm').click();
                this.innerHTML = originalText;
                this.disabled = false;
                this.style.background = 'var(--success-color)';
            }, 3000);
        }, 3000);
    });
    
    document.getElementById('clearForm').addEventListener('click', function() {
        const formInputs = document.querySelectorAll('.form-input');
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        
        formInputs.forEach(input => {
            if (input.type === 'text' || input.type === 'email' || input.type === 'tel' || input.type === 'number') {
                input.value = '';
            } else if (input.tagName === 'SELECT') {
                input.selectedIndex = 0;
            } else if (input.tagName === 'TEXTAREA') {
                input.value = '';
            }
        });
        
        checkboxes.forEach(checkbox => checkbox.checked = false);
        
        alert('Form cleared!');
    });
});
</script>
