<div class="dashboard-header">
    <h2><i class="fas fa-bell"></i> System Alerts</h2>
    <div class="quick-actions">
        <button class="btn" id="filterAlerts"><i class="fas fa-filter"></i> Filter Alerts</button>
        <button class="btn" id="markAllRead"><i class="fas fa-check-circle"></i> Mark All Read</button>
    </div>
</div>

<div class="card-container">
    <div class="card">
        <div class="card-header">
            <div class="card-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h3>Critical Alerts</h3>
        </div>
        <h2 class="card-loading">
            <i class="fas fa-sync fa-spin"></i>
        </h2>
    </div>
    <div class="card">
        <div class="card-header">
            <div class="card-icon">
                <i class="fas fa-exclamation-circle"></i>
            </div>
            <h3>Warning Alerts</h3>
        </div>
        <h2 class="card-loading">
            <i class="fas fa-sync fa-spin"></i>
        </h2>
    </div>
    <div class="card">
        <div class="card-header">
            <div class="card-icon">
                <i class="fas fa-info-circle"></i>
            </div>
            <h3>Info Alerts</h3>
        </div>
        <h2 class="card-loading">
            <i class="fas fa-sync fa-spin"></i>
        </h2>
    </div>
    <div class="card">
        <div class="card-header">
            <div class="card-icon">
                <i class="fas fa-eye-slash"></i>
            </div>
            <h3>Unread Alerts</h3>
        </div>
        <h2 class="card-loading">
            <i class="fas fa-sync fa-spin"></i>
        </h2>
    </div>
</div>

<div class="card-grid">
    <div class="activity-panel">
        <div class="panel-header">
            <h3><i class="fas fa-list"></i> Recent Alerts</h3>
            <button class="btn" id="refreshAlerts">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>
        <div style="padding: 20px; text-align: center;">
            <i class="fas fa-sync fa-spin fa-2x" style="color: var(--primary-color); margin-bottom: 15px;"></i>
            <p style="color: var(--text-muted);">Loading system alerts...</p>
        </div>
    </div>

    <div class="system-panel">
        <div class="panel-header">
            <h3><i class="fas fa-cog"></i> Alert Settings</h3>
        </div>
        <div style="padding: 20px;">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Notification Level</label>
                <select class="btn" style="width: 100%; padding: 8px;">
                    <option>All Alerts</option>
                    <option>Critical Only</option>
                    <option>Warnings & Critical</option>
                </select>
            </div>
            <button class="btn" style="width: 100%; background: var(--primary-color); color: white;">
                <i class="fas fa-save"></i> Save Settings
            </button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log('System Alerts module loaded');
    
    document.getElementById('markAllRead')?.addEventListener('click', function() {
        this.innerHTML = '<i class="fas fa-sync fa-spin"></i> Marking...';
        setTimeout(() => {
            this.innerHTML = '<i class="fas fa-check-circle"></i> Mark All Read';
        }, 1500);
    });
});
</script>
