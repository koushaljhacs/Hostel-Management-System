<div class="dashboard-header">
    <h2><i class="fas fa-key"></i> Password Reset Controls</h2>
    <div class="quick-actions">
        <button class="btn" id="resetSettings"><i class="fas fa-save"></i> Save Settings</button>
        <button class="btn" id="sendResetLinks"><i class="fas fa-paper-plane"></i> Send Reset Links</button>
    </div>
</div>

<div class="card-container">
    <div class="card">
        <div class="card-header">
            <div class="card-icon">
                <i class="fas fa-sync"></i>
            </div>
            <h3>Reset Requests</h3>
        </div>
        <h2 class="card-loading">
            <i class="fas fa-sync fa-spin"></i>
        </h2>
    </div>
    <div class="card">
        <div class="card-header">
            <div class="card-icon">
                <i class="fas fa-clock"></i>
            </div>
            <h3>Pending Resets</h3>
        </div>
        <h2 class="card-loading">
            <i class="fas fa-sync fa-spin"></i>
        </h2>
    </div>
    <div class="card">
        <div class="card-header">
            <div class="card-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h3>Completed Today</h3>
        </div>
        <h2 class="card-loading">
            <i class="fas fa-sync fa-spin"></i>
        </h2>
    </div>
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
    <!-- Password Policy Settings -->
    <div style="background: white; border-radius: 8px; padding: 20px; border: 1px solid var(--border-light);">
        <h3 style="color: var(--primary-color); margin-bottom: 20px;">Password Policy</h3>
        
        <div style="display: grid; gap: 15px;">
            <div>
                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Minimum Password Length</label>
                <input type="number" value="8" class="btn" style="width: 100%; padding: 10px; border: 1px solid var(--border-medium); border-radius: 6px;">
            </div>
            
            <div>
                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Password Expiry (days)</label>
                <input type="number" value="90" class="btn" style="width: 100%; padding: 10px; border: 1px solid var(--border-medium); border-radius: 6px;">
            </div>
            
            <div>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" checked style="accent-color: var(--primary-color);">
                    <span style="font-weight: 600;">Require uppercase letters</span>
                </label>
            </div>
            
            <div>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" checked style="accent-color: var(--primary-color);">
                    <span style="font-weight: 600;">Require numbers</span>
                </label>
            </div>
            
            <div>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" style="accent-color: var(--primary-color);">
                    <span style="font-weight: 600;">Require special characters</span>
                </label>
            </div>
        </div>
    </div>

    <!-- Reset Controls -->
    <div style="background: white; border-radius: 8px; padding: 20px; border: 1px solid var(--border-light);">
        <h3 style="color: var(--primary-color); margin-bottom: 20px;">Reset Controls</h3>
        
        <div style="display: grid; gap: 15px;">
            <div>
                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Reset Link Expiry (hours)</label>
                <input type="number" value="24" class="btn" style="width: 100%; padding: 10px; border: 1px solid var(--border-medium); border-radius: 6px;">
            </div>
            
            <div>
                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Max Reset Attempts</label>
                <input type="number" value="3" class="btn" style="width: 100%; padding: 10px; border: 1px solid var(--border-medium); border-radius: 6px;">
            </div>
            
            <div>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" checked style="accent-color: var(--primary-color);">
                    <span style="font-weight: 600;">Notify user on password reset</span>
                </label>
            </div>
            
            <div>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" style="accent-color: var(--primary-color);">
                    <span style="font-weight: 600;">Require security questions</span>
                </label>
            </div>
        </div>
    </div>
</div>

<!-- Recent Reset Requests -->
<div style="background: white; border-radius: 8px; padding: 20px; margin-top: 20px; border: 1px solid var(--border-light);">
    <h3 style="color: var(--primary-color); margin-bottom: 15px;">Recent Reset Requests</h3>
    
    <div style="text-align: center; padding: 40px;">
        <i class="fas fa-sync fa-spin fa-2x" style="color: var(--primary-color); margin-bottom: 15px;"></i>
        <p style="color: var(--text-muted);">Loading reset request history...</p>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log('Password Reset Controls module loaded');
    
    // BACKEND INTEGRATION: Load password policy settings
    // TODO: Fetch current password policy from backend
    
    document.getElementById('resetSettings')?.addEventListener('click', function() {
        this.innerHTML = '<i class="fas fa-sync fa-spin"></i> Saving...';
        setTimeout(() => {
            this.innerHTML = '<i class="fas fa-save"></i> Save Settings';
            alert('Password policy settings updated successfully!');
        }, 1500);
    });
    
    document.getElementById('sendResetLinks')?.addEventListener('click', function() {
        this.innerHTML = '<i class="fas fa-sync fa-spin"></i> Sending...';
        setTimeout(() => {
            this.innerHTML = '<i class="fas fa-paper-plane"></i> Send Reset Links';
            alert('Password reset links sent to selected users!');
        }, 2000);
    });
});
</script>
